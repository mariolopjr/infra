# Weekly flake.lock PR
name: update flake.lock
on:
  schedule:
    - cron: "17 10 * * 0" # Sunday ~5am EST (6am EDT)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write # GITHUB_TOKEN-made PRs trigger no workflows, so the result is posted as a commit status

env:
  SYSTEM: .#nixosConfigurations.winterfell.config.system.build.toplevel
  CONFIG: .#nixosConfigurations.winterfell.config
  # Installed packages only: a .drv closure diff lists every source and patch in nixpkgs
  PACKAGES: >-
    c: map (p: p.name) (c.environment.systemPackages ++ c.home-manager.users.mario.home.packages ++ [ c.boot.kernelPackages.kernel ])

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      # Room for the desktop closure
      - uses: jlumbroso/free-disk-space@v1.3.1
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          # Same caches as modules/_caches.nix, or noctalia and umbriel build from source.
          extra-conf: |
            extra-substituters = https://noctalia.cachix.org https://umbriel.cachix.org https://nix-community.cachix.org
            extra-trusted-public-keys = noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4= umbriel.cachix.org-1:JfNq/2yg2S6D6z4Z2dVSZrZlDPQTKtexB6GAVLD98nw= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - run: nix eval --json "$CONFIG" --apply "$PACKAGES" | jq -r '.[]' | sort -u > /tmp/old.txt

      # Rex.app has no flake input
      - run: scripts/update-rex-app.sh

      # Live list and not a flake input (see modules/features/opensnitch.nix)
      - run: curl -fsSL 'https://pgl.yoyo.org/adservers/serverlist.php?hostformat=hosts&showintro=0&mimetype=plaintext' -o modules/features/opensnitch-pgl.txt

      - id: update
        uses: DeterminateSystems/update-flake-lock@main
        with:
          commit-msg: "chore(flake): update flake.lock"
          pr-title: "chore(flake): update flake.lock"
          pr-labels: dependencies

      - if: steps.update.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.update.outputs.pull-request-number }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git fetch origin update_flake_lock_action
          git checkout FETCH_HEAD
          # A nixpkgs (nixfmt) or flake-file bump can change the generated flake.nix
          nix run .#write-flake
          if ! git diff --quiet flake.nix; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(flake): regenerate flake.nix" flake.nix
            git push origin HEAD:update_flake_lock_action
          fi
          status() {
            gh api "repos/$GITHUB_REPOSITORY/statuses/$(git rev-parse HEAD)" -f context="flake check + winterfell build" \
              -f state="$1" -f description="$2" -f target_url="$RUN" > /dev/null
          }
          status pending "running"
          {
            gh pr view "$PR" --json body -q .body
            echo
            # --impure: devenv shells need the working directory. Evaluates every host, builds x86_64-linux checks.
            if nix flake check -L --all-systems --impure && nix build -L --out-link new "$SYSTEM"; then
              echo "## winterfell"
              echo
              nix eval --json "$CONFIG" --apply "$PACKAGES" | jq -r '.[]' | sort -u > /tmp/new.txt
              echo '```diff'
              diff --old-line-format='- %L' --new-line-format='+ %L' --unchanged-line-format='' /tmp/old.txt /tmp/new.txt | head -c 55000 || true
              echo '```'
            else
              echo "## flake check or winterfell build failed"
              echo
              echo "$RUN"
              touch failed
            fi
          } > body.md
          gh pr edit "$PR" --body-file body.md
          if [ -e failed ]; then status failure "failed"; exit 1; fi
          status success "passed"
